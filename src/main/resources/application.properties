spring.application.name=DevOps Monitoring Portal
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

spring.datasource.url=mongodb+srv://sarfarazakbar777_db_user:3MmKucigvKqRbeZu@devopsmonitoring.xgdogit.mongodb.net/?appName=devopsmonitoring
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}

info.app.name=${spring.application.name}
info.app.version=${app.build.version}
info.app.build-number=${app.build.build-number}
info.app.environment=${app.build.environment}
info.app.image-tag=${app.build.image-tag}
info.app.git-commit-id=${app.build.git-commit-id}
info.app.branch-name=${app.build.branch-name}

app.build.version=${APP_VERSION:1.0.0}
app.build.build-number=${BUILD_NUMBER:local}
app.build.build-timestamp=${BUILD_TIMESTAMP:2026-01-01T00:00:00}
app.build.environment=${APP_ENVIRONMENT:prod}
app.build.image-tag=${IMAGE_TAG:latest}
app.build.git-commit-id=${GIT_COMMIT_ID:unknown}
app.build.branch-name=${BRANCH_NAME:main}
app.build.deployment-time=${DEPLOYMENT_TIME:${BUILD_TIMESTAMP:2026-01-01T00:00:00}}

app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:ChangeMe123!}
