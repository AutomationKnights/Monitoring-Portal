<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deployment - DevOps Monitoring Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="d-flex">
    <aside class="sidebar bg-dark text-white p-3">
        <h5 class="mb-4">Monitoring</h5>
        <nav class="nav flex-column">
            <a class="nav-link text-white" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link text-white active" th:href="@{/deployment}">Deployment</a>
            <a class="nav-link text-white" th:href="@{/health}">Health</a>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-sm btn-outline-light mt-3 w-100" type="submit">Logout</button>
            </form>
        </nav>
    </aside>

    <main class="flex-grow-1 p-4">
        <h3>Deployment Information</h3>
        <div class="row g-3 mt-1">
            <div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><div class="small text-muted">Image Tag</div><div th:text="${build.imageTag}"></div></div></div></div>
            <div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><div class="small text-muted">Application Version</div><div th:text="${build.applicationVersion}"></div></div></div></div>
            <div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><div class="small text-muted">Deployment Time</div><div th:text="${build.deploymentTime}"></div></div></div></div>
            <div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><div class="small text-muted">Git Commit ID</div><div th:text="${build.gitCommitId}"></div></div></div></div>
            <div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><div class="small text-muted">Branch Name</div><div th:text="${build.branchName}"></div></div></div></div>
            <div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><div class="small text-muted">Build Number</div><div th:text="${build.buildNumber}"></div></div></div></div>
        </div>

        <div class="card shadow-sm mt-4">
            <div class="card-header">Deployment History</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>Version</th>
                            <th>Deployment Time</th>
                            <th>Environment</th>
                            <th>Image Tag</th>
                            <th>Status</th>
                            <th>Build</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${deployments}">
                            <td th:text="${item.version}"></td>
                            <td th:text="${item.deploymentTime}"></td>
                            <td th:text="${item.environment}"></td>
                            <td th:text="${item.imageTag}"></td>
                            <td>
                                <span class="badge text-bg-success" th:if="${item.status == 'DEPLOYED'}" th:text="${item.status}"></span>
                                <span class="badge text-bg-secondary" th:if="${item.status != 'DEPLOYED'}" th:text="${item.status}"></span>
                            </td>
                            <td th:text="${item.buildNumber}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
