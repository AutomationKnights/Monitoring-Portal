name: CI-CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

env:
  APP_NAME: devops-monitoring-portal

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B clean verify

  docker:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Resolve ACR login server
        id: acr
        run: echo "login_server=$(az acr show --name ${{ secrets.ACR_NAME }} --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"
      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}
      - name: Build and push image
        id: image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          ACR_LOGIN_SERVER=${{ steps.acr.outputs.login_server }}
          docker build -t $ACR_LOGIN_SERVER/$APP_NAME:$IMAGE_TAG -t $ACR_LOGIN_SERVER/$APP_NAME:latest .
          docker push $ACR_LOGIN_SERVER/$APP_NAME:$IMAGE_TAG
          docker push $ACR_LOGIN_SERVER/$APP_NAME:latest
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
      - name: Resolve ACR login server
        id: acr
        run: echo "login_server=$(az acr show --name ${{ secrets.ACR_NAME }} --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"
      - name: Create image pull secret
        run: |
          az acr update --name ${{ secrets.ACR_NAME }} --admin-enabled true
          ACR_USERNAME=$(az acr credential show --name ${{ secrets.ACR_NAME }} --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name ${{ secrets.ACR_NAME }} --query "passwords[0].value" -o tsv)
          kubectl create secret docker-registry acr-pull-secret \
            --docker-server=${{ steps.acr.outputs.login_server }} \
            --docker-username=$ACR_USERNAME \
            --docker-password=$ACR_PASSWORD \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml
      - name: Update image and build metadata
        run: |
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%S)
          ACR_LOGIN_SERVER=${{ steps.acr.outputs.login_server }}
          kubectl set image deployment/$APP_NAME $APP_NAME=$ACR_LOGIN_SERVER/$APP_NAME:${{ needs.docker.outputs.image_tag }}
          kubectl set env deployment/$APP_NAME \
            APP_VERSION=${{ github.ref_name }} \
            BUILD_NUMBER=${{ github.run_number }} \
            BUILD_TIMESTAMP=$BUILD_TIMESTAMP \
            IMAGE_TAG=${{ needs.docker.outputs.image_tag }} \
            GIT_COMMIT_ID=${{ github.sha }} \
            BRANCH_NAME=${{ github.ref_name }} \
            DEPLOYMENT_TIME=$BUILD_TIMESTAMP
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/$APP_NAME --timeout=300s || {
            echo "Rollout failed. Collecting diagnostics..."
            kubectl get deployment $APP_NAME -o wide
            kubectl get rs -l app=$APP_NAME -o wide
            kubectl get pods -l app=$APP_NAME -o wide
            kubectl describe deployment $APP_NAME
            kubectl describe pods -l app=$APP_NAME
            kubectl logs -l app=$APP_NAME --all-containers=true --tail=200
            exit 1
          }
