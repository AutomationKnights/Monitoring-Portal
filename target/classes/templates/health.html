<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Health - DevOps Monitoring Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="d-flex">
    <aside class="sidebar bg-dark text-white p-3">
        <h5 class="mb-4">Monitoring</h5>
        <nav class="nav flex-column">
            <a class="nav-link text-white" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link text-white" th:href="@{/deployment}">Deployment</a>
            <a class="nav-link text-white active" th:href="@{/health}">Health</a>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-sm btn-outline-light mt-3 w-100" type="submit">Logout</button>
            </form>
        </nav>
    </aside>

    <main class="flex-grow-1 p-4">
        <h3>Application Health</h3>
        <div class="row g-3 mt-1">
            <div class="col-md-3">
                <div class="card shadow-sm"><div class="card-body"><div class="small text-muted">Application Status</div><div th:text="${health.applicationStatus}"></div></div></div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm"><div class="card-body"><div class="small text-muted">Database Status</div><div th:text="${health.databaseStatus}"></div></div></div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm"><div class="card-body"><div class="small text-muted">Disk Space</div><div th:text="${health.diskSpaceStatus}"></div></div></div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm"><div class="card-body"><div class="small text-muted">JVM Status</div><div th:text="${health.jvmStatus}"></div></div></div>
            </div>
        </div>
        <div class="card shadow-sm mt-4">
            <div class="card-header">All Components</div>
            <div class="card-body">
                <table class="table table-sm table-striped">
                    <thead><tr><th>Component</th><th>Status</th></tr></thead>
                    <tbody>
                    <tr th:each="entry : ${health.components}">
                        <td th:text="${entry.key}"></td>
                        <td>
                            <span class="badge text-bg-success" th:if="${entry.value == 'UP'}" th:text="${entry.value}"></span>
                            <span class="badge text-bg-danger" th:if="${entry.value != 'UP'}" th:text="${entry.value}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
